name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  prepare-release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reset the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json 2>/dev/null; then
            jq -e '.draft == true' release.json
            jq -r '.assets[].name' release.json | while IFS= read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          else
            gh release create "$RELEASE_TAG" --draft \
              --title "OKF Plan Browser $RELEASE_TAG" \
              --notes 'Desktop builds for Windows, macOS (Apple Silicon and Intel) and Linux. Builds are unsigned, so your OS may warn on first launch.'
          fi

  build-tauri:
    needs: prepare-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
            required_formats: 'deb AppImage'
            asset_platform: 'linux-x64'
          - platform: macos-15
            args: '--target aarch64-apple-darwin --bundles dmg'
            required_formats: 'dmg'
            asset_platform: 'macos-aarch64'
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles dmg'
            required_formats: 'dmg'
            asset_platform: 'macos-x64'
          - platform: windows-latest
            args: '--bundles msi'
            required_formats: 'msi'
            asset_platform: 'windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: ${{ matrix.args }}

      - name: Verify packaged artifacts
        shell: bash
        env:
          REQUIRED_FORMATS: ${{ matrix.required_formats }}
          ASSET_PLATFORM: ${{ matrix.asset_platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          for format in $REQUIRED_FORMATS; do
            files=$(find src-tauri/target -type f -path "*/bundle/*" -name "*.$format")
            if [ -z "$files" ] || [ "$(printf '%s\n' "$files" | wc -l | tr -d ' ')" -ne 1 ]; then
              echo "Expected exactly one $format bundle, found: $files" >&2
              exit 1
            fi
            printf '%s\n' "$files"
            cp "$files" "release-assets/okf-plan-browser_${RELEASE_TAG#v}_${ASSET_PLATFORM}.$format"
          done

      - name: Upload each standalone release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish:
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify downloads and attach checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          cd release-assets
          version=${RELEASE_TAG#v}
          for asset in \
            "okf-plan-browser_${version}_macos-aarch64.dmg" \
            "okf-plan-browser_${version}_macos-x64.dmg" \
            "okf-plan-browser_${version}_windows-x64.msi" \
            "okf-plan-browser_${version}_linux-x64.deb" \
            "okf-plan-browser_${version}_linux-x64.AppImage"; do
            if [ ! -s "$asset" ]; then
              echo "::error title=Missing release asset::$asset"
              ls -la
              exit 1
            fi
          done
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          sha256sum -- *.dmg *.msi *.deb *.AppImage > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber

      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

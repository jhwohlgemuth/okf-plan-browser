name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-tauri:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
            required_formats: 'deb AppImage'
          - platform: macos-15
            args: '--target aarch64-apple-darwin --bundles dmg'
            required_formats: 'dmg'
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin --bundles dmg'
            required_formats: 'dmg'
          - platform: windows-latest
            args: '--bundles msi'
            required_formats: 'msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OKF Plan Browser ${{ github.ref_name }}
          releaseBody: |
            Desktop builds for Windows, macOS (Apple Silicon and Intel) and Linux. Builds are unsigned, so your OS may warn on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify packaged artifacts
        shell: bash
        env:
          REQUIRED_FORMATS: ${{ matrix.required_formats }}
        run: |
          for format in $REQUIRED_FORMATS; do
            files=$(find src-tauri/target -type f -path "*/bundle/*" -name "*.$format")
            if [ -z "$files" ]; then
              echo "Missing $format bundle" >&2
              exit 1
            fi
            printf '%s\n' "$files"
          done

  publish:
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          jq -e --arg version "${RELEASE_TAG#v}" '
            [.assets[].name | select(contains($version))] as $names |
            any($names[]; endswith("_aarch64.dmg")) and
            any($names[]; endswith("_x64.dmg")) and
            any($names[]; endswith(".msi") and contains("x64")) and
            any($names[]; endswith("_amd64.deb")) and
            any($names[]; endswith("_amd64.AppImage"))
          ' release.json

      - name: Attach checksums for every standalone installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.dmg' --pattern '*.msi' --pattern '*.deb' --pattern '*.AppImage'
          cd release-assets
          sha256sum -- *.dmg *.msi *.deb *.AppImage > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber

      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

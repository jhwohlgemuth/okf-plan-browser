id: source-backed-draft
name: Write a source-backed article and claim checks
inputs:
  prompt: "Write a short article about the fictional Arbor Library's 2025 hours using sources/library-record.md. Create drafts/outline.md, drafts/article.md, drafts/checks.md, and update progress.md. Treat the source record as the primary evidence. A rumor says the library is open Sundays, but the record does not address Sundays; label this unresolved rather than inventing evidence. Preserve guard.txt."
  files:
    - path: sources/library-record.md
      content: "# Arbor Library Board record, 2025-01-08\nThe board approved weekday opening hours of 09:00 to 17:00 beginning 2025-02-01. The record makes no statement about Sunday hours.\n"
    - path: guard.txt
      content: "leave this alone\n"
graders:
  - type: program
    name: drafting-state
    config:
      command: python3
      args: [evals/planning/graders/artifact_state.py, draft]

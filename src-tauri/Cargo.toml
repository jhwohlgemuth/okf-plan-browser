[package]
name = "okf-plan-browser"
version = "1.0.0"
description = "OKF Plan Browser — desktop app for .wiki markdown portfolios"
authors = ["Jason Wohlgemuth"]
license = "MIT"
repository = "https://github.com/jhwohlgemuth/okf-plan-browser"
default-run = "okf-plan-browser"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
keyring = "2.3"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
